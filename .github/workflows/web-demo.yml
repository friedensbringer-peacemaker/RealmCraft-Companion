name: Publish Companion Web Demo
on:
  push:
    branches: [main]
    paths:
      - 'RealmCraftWebDemo/**'
      - '.github/workflows/web-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate publication contents
        run: python3 tools/check_publication.py
      - name: Test demo logic
        run: node --test RealmCraftWebDemo/tests/*.test.cjs
      - name: Check JavaScript syntax
        run: |
          for script in RealmCraftWebDemo/*.js; do node --check "$script"; done
      - name: Fetch the checksum-pinned reviewed demo
        env:
          DEMO_OWNER: ${{ github.repository_owner }}
        run: python3 RealmCraftWebDemo/tools/fetch_demo.py --owner "$DEMO_OWNER" --output "$RUNNER_TEMP/demo.zip"
      - name: Build static demo and validate guide catalogs
        run: python3 RealmCraftWebDemo/tools/build.py --demo-zip "$RUNNER_TEMP/demo.zip"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: RealmCraftWebDemo/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

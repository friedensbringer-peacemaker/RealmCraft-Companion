 <text x="48" y="115" fill="#f1f6ee" font-size="39" font-weight="700">Your world. A little clearer.</text>
 <text x="49" y="148" fill="#b8cac6" font-size="18">Explore saved worlds, find materials and plan what comes next.</text>
 <rect x="48" y="184" width="456" height="218" rx="18" fill="#1c3635" stroke="#88bc79" stroke-width="2"/>
 <rect x="70" y="204" width="125" height="25" rx="12" fill="#c2e797"/>
 <text x="132" y="221" text-anchor="middle" fill="#193126" font-size="11" font-weight="700" letter-spacing="1">MAIN PROJECT</text>
 <text x="72" y="266" fill="#f1f6ee" font-size="27" font-weight="700">macOS Companion</text>
 <text x="72" y="300" fill="#c4d5ce" font-size="16">Back up. Explore. Plan.</text>
 <text x="72" y="330" fill="#adc3bc" font-size="14">World maps · chests · player tools</text>
 <text x="72" y="354" fill="#adc3bc" font-size="14">Build guides · optional local AI</text>
 <g transform="translate(376 252)">
  <rect width="94" height="64" rx="7" fill="#102727" stroke="#93c6a5" stroke-width="2"/>

 <rect x="548" y="243" width="25" height="36" rx="5" fill="none" stroke="#7ecacb" stroke-width="2"/><path d="M556 274h9" stroke="#7ecacb" stroke-width="2"/>
 <text x="548" y="314" fill="#eef6f2" font-size="23" font-weight="700">Android / Quest</text>
 <text x="548" y="345" fill="#b5ccca" font-size="14">Maps and snapshot inspection</text>
 <text x="548" y="369" fill="#b5ccca" font-size="14">On your phone or headset panel</text>
 <rect x="848" y="184" width="304" height="218" rx="18" fill="#202d3b" stroke="#43546a"/>

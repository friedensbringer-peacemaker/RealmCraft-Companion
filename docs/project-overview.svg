<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
<title id="title">RealmCraft Companion — three ways to explore a saved world</title>
<desc id="description">Conceptual project graphic, not an application screenshot. The main macOS Companion connects to an experimental Android and Quest app and a browser demonstration.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f27"/><stop offset="1" stop-color="#142c29"/></linearGradient>
 <linearGradient id="green" x2="1" y2="1"><stop stop-color="#c8ea92"/><stop offset="1" stop-color="#63c8a8"/></linearGradient>
</defs>
<rect width="1200" height="470" rx="24" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif">
 <path d="M48 45l17-10 17 10v20L65 75 48 65z" fill="#bde78b"/><path d="M48 45l17 10 17-10M65 55v20" fill="none" stroke="#497965" stroke-width="2"/>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "realmcraft-atlas"
version = "0.1.0"
description = "Local, read-only Realmcraft savegame maps"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "Pillow>=10.4,<13"]
[project.scripts]
realmcraft-atlas = "realmcraft_map.__main__:main"
[tool.setuptools.packages.find]
include = ["realmcraft_map*"]
[tool.setuptools.package-data]
realmcraft_map = ["blocks.json", "web/*"]
